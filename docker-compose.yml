# Base de datos para desarrollo local: `pnpm db:up`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nutriapp
      POSTGRES_PASSWORD: nutriapp
      POSTGRES_DB: nutriapp
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado en local,
      # que suele ocupar el 5432.
      - "5433:5432"
    volumes:
      - nutriapp-db:/var/lib/postgresql/data

volumes:
  nutriapp-db:
