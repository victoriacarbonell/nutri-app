# Base de datos para desarrollo local: `pnpm db:up`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nutriapp
      POSTGRES_PASSWORD: nutriapp
      POSTGRES_DB: nutriapp
    ports:
      - "5432:5432"
    volumes:
      - nutriapp-db:/var/lib/postgresql/data

volumes:
  nutriapp-db:
