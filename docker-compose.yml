# Database for local development: `pnpm db:up`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nutriapp
      POSTGRES_PASSWORD: nutriapp
      POSTGRES_DB: nutriapp
    ports:
      # Port 5433 on the host to avoid clashing with a locally installed
      # PostgreSQL, which usually takes 5432.
      - "5433:5432"
    volumes:
      - nutriapp-db:/var/lib/postgresql/data

volumes:
  nutriapp-db:
